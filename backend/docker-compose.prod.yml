# Production on the Oracle Always Free VM. Reads secrets from backend/.env (never committed):
#   POSTGRES_PASSWORD=...        database password for the app role
#   RAILS_MASTER_KEY=...         contents of config/master.key
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in backend/.env}
      POSTGRES_DB: app_production
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app_production"]
      interval: 5s
      retries: 30

  api:
    build: .
    command: ["./bin/rails", "server", "-b", "0.0.0.0", "-p", "3000"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      RAILS_ENV: production
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY:?set RAILS_MASTER_KEY in backend/.env}
      DATABASE_URL: postgres://app:${POSTGRES_PASSWORD}@db:5432/app_production
    ports:
      - "80:3000"

volumes:
  pgdata:
